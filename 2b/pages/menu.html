<!-- Halaman 2b: Denah meja & pre-order menu (interaktif / simulasi) -->
<h2 class="mb-3">Denah meja &amp; pre-order menu</h2>
<div class="row g-3">
  <div class="col-lg-8">
    <div class="panel mb-3">
      <div id="tabArea" class="mb-3 d-flex flex-wrap gap-2"></div>
      <div id="gridMeja" class="grid-meja"></div>
      <div class="small mt-3 d-flex flex-wrap gap-3">
        <span><i class="dot" style="background:#2e9d5b"></i>Kosong</span>
        <span><i class="dot" style="background:#e0a100"></i>Direservasi</span>
        <span><i class="dot" style="background:#2f6fb5"></i>Terisi</span>
      </div>
      <p id="infoMeja" class="mt-2 mb-0 fw-semibold"></p>
    </div>
    <div class="panel mb-3">
      <style>.menu-foto img{width:100%;border-radius:8px}.menu-foto .carousel-control-prev,.menu-foto .carousel-control-next{width:12%}</style>
      <h3 class="h5">Menu Teman Setia</h3>
      <div id="carMenu" class="carousel slide menu-foto" data-bs-ride="false">
        <div class="carousel-indicators" style="margin-bottom:-.5rem">
          <button type="button" data-bs-target="#carMenu" data-bs-slide-to="0" class="active" aria-label="Halaman 1"></button>
          <button type="button" data-bs-target="#carMenu" data-bs-slide-to="1" aria-label="Halaman 2"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active"><a href="assets/img/menu-teman-setia-1.jpg" target="_blank" rel="noopener"><img src="assets/img/menu-teman-setia-1.jpg" alt="Menu Teman Setia halaman 1: bakmie, bubur bakar claypot, ala carte, topping, dan kuah"></a></div>
          <div class="carousel-item"><a href="assets/img/menu-teman-setia-2.jpg" target="_blank" rel="noopener"><img src="assets/img/menu-teman-setia-2.jpg" alt="Menu Teman Setia halaman 2: nasi claypot, roti bakar, dimsum, cemilan, dan minuman"></a></div>
          <div class="carousel-item"><a href="assets/img/menu-teman-setia-3.jpg" target="_blank" rel="noopener"><img src="assets/img/menu-teman-setia-3.jpg" alt="Menu Teman Setia halaman 2: nasi claypot, roti bakar, dimsum, cemilan, dan minuman"></a></div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carMenu" data-bs-slide="prev" aria-label="Sebelumnya"><span class="carousel-control-prev-icon"></span></button>
        <button class="carousel-control-next" type="button" data-bs-target="#carMenu" data-bs-slide="next" aria-label="Berikutnya"><span class="carousel-control-next-icon"></span></button>
      </div>
      <p class="small text-secondary mt-2 mb-0">Klik gambar untuk memperbesar. Sumber: foto menu Teman Setia Surabaya.</p>
    </div>
    <div class="panel">
      <div class="d-flex flex-wrap gap-2 mb-2">
        <input id="cari" type="search" class="form-control" style="max-width:220px" placeholder="Cari menu" aria-label="Cari menu">
        <div id="filterKat" class="btn-group" role="group" aria-label="Kategori menu">
          <button class="btn btn-teal btn-sm" data-k="all">Semua</button>
          <button class="btn btn-outline-teal btn-sm" data-k="food">Makanan</button>
          <button class="btn btn-outline-teal btn-sm" data-k="beverage">Minuman</button>
        </div>
      </div>
      <div id="daftarMenu"></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="panel keranjang">
      <h3 class="h5">Pesanan Anda</h3>
      <div id="isiKeranjang" class="mb-2"></div>
      <div class="input-group input-group-sm mb-2">
        <input id="kodePromo" class="form-control" placeholder="Kode promo (coba HEMAT10)">
        <button id="pakaiPromo" class="btn btn-outline-teal" type="button">Pakai</button>
      </div>
      <div id="pesanPromo" class="small mb-2"></div>
      <table class="table table-sm mb-2">
        <tr><td>Subtotal</td><td class="text-end" id="tSub"></td></tr>
        <tr><td>Diskon</td><td class="text-end" id="tDisc"></td></tr>

        <tr><td>Pajak 10%</td><td class="text-end" id="tTax"></td></tr>
        <tr class="fw-bold"><td>Total</td><td class="text-end" id="tTotal"></td></tr>
      </table>
      <button id="lanjut" class="btn btn-amber w-100">Lanjut ke reservasi</button>
      <button id="kosongkan" class="btn btn-link btn-sm w-100 text-secondary">Kosongkan pesanan</button>
    </div>
  </div>
</div>
<script>
(function () {
  var A = window.APP, area = A.meja ? A.meja.area : Object.keys(A.areas)[0], kat = 'all';

  function gambarTab() {
    var h = '';
    Object.keys(A.areas).forEach(function (a) {
      h += '<button class="btn btn-sm ' + (a === area ? 'btn-teal' : 'btn-outline-teal') + '" data-a="' + a + '">' + a + '</button>';
    });
    $('#tabArea').html(h);
  }
  function gambarMeja() {
    var h = '';
    A.areas[area].forEach(function (t) {
      var sel = A.meja && A.meja.id === t.id ? ' selected' : '';
      h += '<button class="meja ' + t.status + sel + '" data-id="' + t.id + '"' + (t.status !== 'available' ? ' disabled' : '') +
           ' aria-label="Meja ' + t.no + ', ' + t.cap + ' tamu, ' + t.status + '"><b>' + t.no + '</b><small>' + t.cap + ' pax</small></button>';
    });
    $('#gridMeja').html(h);
    $('#infoMeja').text(A.meja ? 'Meja ' + A.meja.no + ' · ' + A.meja.area + ' · kapasitas ' + A.meja.cap + ' tamu' : 'Pilih meja yang berwarna hijau.');
  }
  function gambarMenu() {
    var q = $('#cari').val().toLowerCase(), h = '';
    A.menus.forEach(function (m) {
      if ((kat !== 'all' && m.type !== kat) || m.name.toLowerCase().indexOf(q) < 0) return;
      h += '<div class="item-menu"><div><div class="fw-semibold">' + m.name + '</div><small class="text-secondary">' + A.rp(m.price) +
           '</small></div><button class="btn btn-sm btn-outline-teal" data-add="' + m.id + '">Tambah</button></div>';
    });
    $('#daftarMenu').html(h || '<p class="text-secondary my-3">Menu tidak ditemukan. Coba kata kunci lain.</p>');
  }
  function gambarKeranjang() {
    var h = '';
    A.menus.forEach(function (m) {
      var q = A.cart[m.id]; if (!q) return;
      h += '<div class="d-flex justify-content-between align-items-center small py-1"><span>' + m.name + '</span><span class="text-nowrap">' +
           '<button class="btn btn-sm btn-light py-0" data-min="' + m.id + '" aria-label="Kurangi">−</button> ' + q +
           ' <button class="btn btn-sm btn-light py-0" data-add="' + m.id + '" aria-label="Tambah">+</button></span></div>';
    });
    $('#isiKeranjang').html(h || '<p class="small text-secondary">Belum ada menu. Tekan Tambah pada daftar menu.</p>');
    var t = A.hitung();
    $('#tSub').text(A.rp(t.subtotal)); $('#tDisc').text('− ' + A.rp(t.discount));
    $('#tSvc').text(A.rp(t.service)); $('#tTax').text(A.rp(t.tax)); $('#tTotal').text(A.rp(t.total));
  }

  $('#tabArea').on('click', '[data-a]', function () { area = $(this).data('a'); gambarTab(); gambarMeja(); });
  $('#gridMeja').on('click', '.meja.available', function () { A.meja = A.cariMeja($(this).data('id')); gambarMeja(); });
  $('#filterKat').on('click', 'button', function () {
    kat = $(this).data('k');
    $('#filterKat button').removeClass('btn-teal').addClass('btn-outline-teal');
    $(this).removeClass('btn-outline-teal').addClass('btn-teal'); gambarMenu();
  });
  $('#cari').on('input', gambarMenu);
  $('#daftarMenu, #isiKeranjang').on('click', '[data-add]', function () {
    var id = $(this).data('add'); A.cart[id] = (A.cart[id] || 0) + 1; gambarKeranjang();
  });
  $('#isiKeranjang').on('click', '[data-min]', function () {
    var id = $(this).data('min'); if (--A.cart[id] <= 0) delete A.cart[id]; gambarKeranjang();
  });
  $('#pakaiPromo').on('click', function () {
    var ok = $('#kodePromo').val().trim().toUpperCase() === 'HEMAT10';
    A.promo = ok;
    $('#pesanPromo').attr('class', 'small mb-2 ' + (ok ? 'text-success' : 'text-danger'))
      .text(ok ? 'Diskon 10% berlaku untuk belanja minimal Rp 50.000.' : 'Kode promo tidak dikenal.');
    gambarKeranjang();
  });
  $('#kosongkan').on('click', function () { A.cart = {}; A.promo = false; $('#pesanPromo').text(''); gambarKeranjang(); });
  $('#lanjut').on('click', function () { location.hash = 'reservasi'; });

  gambarTab(); gambarMeja(); gambarMenu(); gambarKeranjang();
})();
</script>
