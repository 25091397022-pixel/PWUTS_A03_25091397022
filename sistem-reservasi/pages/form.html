<h2>Master menu</h2>
<form id="f" class="card" novalidate>
  <h3 id="jd">Tambah menu</h3>
  <div class="row">
    <label>Kategori<select id="kt"><option value="">Pilih kategori</option><option>Alacarte</option><option>Beverage</option><option>Food</option><option>Dimsum</option><option>Promo</option><option>Roti Bakar</option><option>Snack</option><option>Topping</option></select><span class="err"></span></label>
    <label>Kode menu<input id="kd" placeholder="Contoh: MN001" maxlength="5"><span class="err"></span></label>
  </div>
  <label>Nama menu<input id="nm"><span class="err"></span></label>
  <div class="row">
    <label>Harga (Rp)<input id="hg" type="number"><span class="err"></span></label>
    <label>Stok (kosongkan jika tak terbatas)<input id="sk" type="number"><span class="err"></span></label>
  </div>
  <label>Deskripsi<textarea id="ds" rows="2"></textarea><span class="err"></span></label>
  <label><input type="checkbox" id="av" checked style="display:inline;width:auto"> Menu tersedia</label>
  <button class="btn" id="sv">Simpan menu</button>
  <button class="btn alt" type="button" id="bt" hidden>Batal</button>
  <div id="ok"></div>
</form>
<div class="card"><h3>Daftar menu</h3>
  <div style="overflow-x:auto">
  <table id="dm"><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></table>
  </div>
</div>
<script>
(function(){
  var L=DB.menu,ed=null;
  function render(){
    var $t=$('#dm');$t.find('tr:gt(0)').remove();
    $.each(L,function(i,r){
      var $r=$('<tr>');
      $.each([r.kd,r.nm,r.kt,rp(r.hg),r.sk===''?'Tak terbatas':r.sk,r.av?'Tersedia':'Habis'],function(_i,c){$r.append($('<td>').text(c))});
      $r.append($('<td>').css('white-space','nowrap').append(
        $('<button type="button" class="btn alt ub">').text('Ubah').data('i',i),' ',
        $('<button type="button" class="btn alt hp">').text('Hapus').data('i',i)));
      $t.append($r);
    });
  }
  function reset(){
    ed=null;$('#f')[0].reset();$('#kd').prop('readonly',false);
    $('#sv').text('Simpan menu');$('#bt').prop('hidden',true);$('#jd').text('Tambah menu');
    $('#f .bad').removeClass('bad');$('#f .err').text('');
  }
  $('#f').on('submit',function(e){
    e.preventDefault();
    var ok=1,v=function(i){return $(i).val().trim()},kd=v('#kd').toUpperCase(),sk=v('#sk');
    ok&=chk('#kt',v('#kt')!=='','Pilih kategori.');
    ok&=chk('#kd',/^[A-Z]{2}\d{3}$/.test(kd)&&(ed!==null||!ada(L,function(r){return r.kd===kd})),'Kode harus 2 huruf + 3 angka (contoh MN001) dan belum dipakai.');
    ok&=chk('#nm',v('#nm').length>=3,'Nama menu minimal 3 karakter.');
    ok&=chk('#hg',+v('#hg')>=1000,'Harga minimal Rp 1.000.');
    ok&=chk('#sk',sk===''||(+sk>=0&&+sk%1===0),'Stok harus bilangan bulat 0 atau lebih.');
    ok&=chk('#ds',v('#ds').length<=150,'Deskripsi maksimal 150 karakter.');
    if(!ok)return;
    // Tahap lanjutan: $.post('api/menu.php',$(this).serialize()) untuk tambah, ubah, dan hapus
    var r={kd:kd,nm:v('#nm'),kt:v('#kt'),hg:+v('#hg'),sk:sk,av:$('#av').is(':checked'),ds:v('#ds')},msg;
    if(ed===null){L.push(r);msg='Menu '+r.nm+' (kode '+kd+') ditambahkan.'}
    else{L[ed]=r;msg='Menu '+r.nm+' (kode '+kd+') diperbarui.'}
    reset();render();
    $('#ok').empty().append($('<div class="msg">').text(msg));
  });
  $('#dm').on('click','.ub',function(){
    var i=$(this).data('i'),r=L[i];ed=i;
    $('#kt').val(r.kt);$('#kd').val(r.kd).prop('readonly',true);$('#nm').val(r.nm);
    $('#hg').val(r.hg);$('#sk').val(r.sk);$('#ds').val(r.ds);$('#av').prop('checked',r.av);
    $('#sv').text('Simpan perubahan');$('#bt').prop('hidden',false);$('#jd').text('Ubah menu '+r.kd);
    $('#ok').empty();$('html,body').animate({scrollTop:$('#f').offset().top-10},300);
  });
  $('#dm').on('click','.hp',function(){
    var i=$(this).data('i'),r=L[i];
    if(!confirm('Hapus menu '+r.nm+' ('+r.kd+')?'))return;
    L.splice(i,1);
    if(ed===i)reset();else if(ed!==null&&ed>i)ed--;
    render();
    $('#ok').empty().append($('<div class="msg">').text('Menu '+r.nm+' dihapus dari daftar.'));
  });
  $('#bt').on('click',function(){reset();$('#ok').empty()});
  render();
})();
</script>
